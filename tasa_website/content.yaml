testimonials:
- name: Katherine Chen
  position: Outreach Intern, Outreach Officer
  question: How was your TASA intern experience?
  response: I loved being TASA intern because I actually got to make amazing memories with some the kindest most genuine people in Berkeley. I'm so grateful for all the people I've gotten to meet, and as intern, I was able to make lasting connections that I will forever appreciate.
  photo: katherine_chen_t.jpg

- name: Cathi Chiu
  position: Historian Intern, Public Relations Officer, External Vice President
  question: What does TASA LOVE mean to you?
  response: To me, TASA LOVE means a sense of belonging. Growing up in and spending the majority of my life time in Taiwan, I was looking for somewhere with a sense of home in college. And TASA happens to be that home. When I'm happy, there is someone to share the happiness with. When I'm down, there is someone who cares about my feelings. I've never felt so welcomed and have sought the old comfort that I was used to in Taiwan. I've created some of the most unforgettable memories while in TASA, and formed the most amazing friendships that I can't ever ask for elsewhere. Because of that, I want to share this TASA LOVE with everyone!
  photo: cathi_chiu_t.jpg

- name: Ryan Hsu
  position: Treasurer Intern, Treasurer Officer, Internal Vice President
  question: What was something you didn't expect as a TASA intern?
  response: I didn't expect the TASA community to be so welcoming towards interns! As soon as I joined, I felt a strong sense of community where I belonged despite joining so recently. I would definitely recommend this experience for anyone looking for their Berkeley family!
  photo: ryan_hsu_t.jpg

- name: Charlize Chen
  position: Family Head Intern, Historian Officer
  question: Who should consider applying to your position? Would you recommend being an officer?
  response: Even though I applied to Historian with limited photography experience, I have been able to slowly develop my skills and have loved capturing small moments at TASA events. As historian, I have the privilege of visually showcasing our welcoming community, the excitement of meeting new people, and genuine care that TASA members dedicate to the club. While historians may typically be on the sidelines during events, everyone in the club sees and acknowledges your hard work. Being Historian has been an unexpectedly gratifying experience and I could not recommend it more!
  photo: charlize_chen_t.jpg

- name: Kailyn Yu
  position: Family Head Intern, Family Head Officer, President
  question: What was your favorite TASA event/memory as a member?
  response: 0.5 Gen Boba Run! This was the first event I went to for TASA, and I was very nervous about going because I didn't know anyone there and didn't know what to expect. When I walked up to the group of people gathered at the Glade, a super sweet and friendly person came up to me and introduced herself to me. We ended up getting along extremely well, and now she's my officer and one of my best friends here at Berkeley :) I also met some of my fellow interns at this event and other general members whom I would see continue to return to club events. This makes me extremely thankful for having gone to that first meeting because I have now found myself a community that supports me and accepts me for who I am.
  photo: kailyn_yu_t.jpg

- name: Matthew Chen
  position: Family Head Intern, Family Head Officer
  question: How was your experience in TASA and what did you learn from your position?
  response: TASA has been a big part of my college life and I learned a lot in my position as a Fam Head. One of the most important things I have learned is event organizing as well as scheduling to make sure certain events will be smoothly ran and at an available time for everyone.
  photo: matt_chen_t.jpg

- name: Sean Wang
  position: Treasurer Intern, Treasurer Officer
  question: How was your TASA intern experience? Would you recommend it?
  response: I really enjoyed my TASA intern experience because of the friends and memories I made out of it. Being surrounded by a great group of people helped make my first semester of college a lot better. I was able to go on spontaneous trips, explore the area, and hangout with my fellow interns often. I would definitely recommend becoming an intern.
  photo: sean_wang_t.jpg
