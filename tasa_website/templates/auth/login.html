{% extends "base.html" %}
{% from "_macros.html" import form_field %}

{% block title %}Log in — TASA @ Berkeley{% endblock %}

{% block content %}
<div class="mx-auto flex max-w-md flex-col px-4 py-24 sm:px-6">
  <h1 class="text-center text-3xl font-semibold tracking-tight">Admin login</h1>
  <form method="post" class="mt-8 space-y-4 rounded-2xl border border-neutral-200 bg-neutral-50 p-6 sm:p-8">
    {{ form.hidden_tag() }}
    {{ form_field(form.username) }}
    {{ form_field(form.password) }}
    <button type="submit"
            class="w-full rounded-lg bg-neutral-900 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-neutral-700">
      Log in
    </button>
  </form>
</div>
{% endblock %}
